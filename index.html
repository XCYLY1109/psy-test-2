<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>森林心理年龄 · 12 个小故事测出你的心理年龄</title>
<meta name="description" content="12 个森林小故事，8 个年龄段，测出你 3 到 99 岁的心理年龄。">
<meta name="theme-color" content="#FBF3DE">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23FBF3DE'/%3E%3Ccircle cx='16' cy='18' r='7' fill='%235C8A54'/%3E%3Ccircle cx='13' cy='16' r='1.6' fill='%23FBF3DE'/%3E%3Ccircle cx='19' cy='16' r='1.6' fill='%23FBF3DE'/%3E%3Crect x='12' y='6' width='3' height='6' rx='1.5' fill='%23ED7A55'/%3E%3Crect x='17' y='6' width='3' height='6' rx='1.5' fill='%23ED7A55'/%3E%3C/svg%3E">
<style>
:root{
  --cream:#FBF3DE;
  --paper:#FFFDF4;
  --ink:#2C4030;
  --ink2:#5E7059;
  --ink3:#93A08A;
  --line:#E6DCC2;
  --green:#5C8A54;
  --deep:#2C4030;
  --sun:#F2BF48;
  --sun-soft:#FBE3A6;
  --coral:#ED7A55;
  --sky:#9BC8D8;
  --berry:#C4698A;
  --shadow:rgba(44,64,48,.16);
  --sans:"PingFang SC","Noto Sans SC","Source Han Sans SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  padding:0 0 86px;
  background:var(--cream);
  background-image:radial-gradient(rgba(44,64,48,.075) 1px,transparent 1.6px);
  background-size:20px 20px;
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.72;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:600px;margin:0 auto;padding:0 18px}
.view{animation:pop .38s cubic-bezier(.22,.9,.32,1.15) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.view{animation:none}*{transition:none!important}}
[hidden]{display:none!important}

/* ===== 通用小零件 ===== */
.card{
  background:var(--paper);
  border:3px solid var(--ink);
  border-radius:22px;
  box-shadow:5px 5px 0 var(--shadow);
}
.tag{
  display:inline-block;
  padding:4px 12px;
  border-radius:999px;
  border:2px solid var(--ink);
  background:var(--sun-soft);
  font-size:13px;
  font-weight:700;
  letter-spacing:.02em;
  line-height:1.6;
}
.btn{
  display:block;
  width:100%;
  padding:16px 20px;
  border-radius:999px;
  border:3px solid var(--ink);
  background:var(--green);
  color:#FFFDF4;
  font-family:var(--sans);
  font-size:18px;
  font-weight:800;
  letter-spacing:.08em;
  cursor:pointer;
  box-shadow:5px 5px 0 var(--ink);
  transition:transform .12s,box-shadow .12s,background .15s;
}
.btn:hover{background:#4F7B48}
.btn:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.btn-2{
  background:var(--paper);
  color:var(--ink);
  box-shadow:5px 5px 0 var(--shadow);
}
.btn-2:hover{background:var(--sun-soft)}
.btn-2:active{box-shadow:1px 1px 0 var(--shadow)}

/* ===== 封面 ===== */
.cover{padding-top:14px}
.hero{
  position:relative;
  height:172px;
  border:3px solid var(--ink);
  border-radius:26px;
  box-shadow:5px 5px 0 var(--shadow);
  overflow:hidden;
  background:#DCEEDC;
}
.hero svg{display:block;width:100%;height:100%}
.hero-cap{
  position:absolute;
  left:14px;bottom:12px;
  background:var(--paper);
  border:2px solid var(--ink);
  border-radius:999px;
  padding:3px 12px;
  font-size:13px;
  font-weight:700;
  transform:rotate(-2deg);
}
.title{
  margin:26px 0 0;
  font-size:38px;
  line-height:1.24;
  font-weight:800;
  letter-spacing:-.01em;
}
.title .mark{
  position:relative;
  display:inline-block;
  color:var(--coral);
}
.title .mark::after{
  content:"";
  position:absolute;
  left:0;right:0;bottom:2px;
  height:10px;
  background:var(--sun);
  border-radius:6px;
  opacity:.55;
  z-index:-1;
}
.lede{
  margin:16px 0 0;
  color:var(--ink2);
  font-size:16px;
  line-height:1.8;
}
.meta{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:18px 0 0;
}
.meta span{
  font-size:13px;
  font-weight:700;
  color:var(--ink2);
  background:#F2EAD0;
  border-radius:999px;
  padding:4px 12px;
}
.start-wrap{margin:26px 0 0}
.start-note{
  margin:10px 0 0;
  font-size:13px;
  color:var(--ink3);
  text-align:center;
}
.dim-block{margin-top:32px}
.dim-head{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.dim-head b{font-size:15px;font-weight:800}
.dim-head i{flex:1;height:2px;background:var(--line);border-radius:2px}
.dim-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
.dim-cell{
  display:flex;
  align-items:center;
  gap:8px;
  background:var(--paper);
  border:2px solid var(--line);
  border-radius:16px;
  padding:8px 10px;
  min-width:0;
}
.dim-cell .ic{flex:0 0 34px;width:34px;height:34px}
.dim-cell .tx{min-width:0}
.dim-cell .nm{font-size:14px;font-weight:800;line-height:1.3}
.dim-cell .ds{font-size:12px;color:var(--ink3);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 答题 ===== */
.quiz{padding-top:16px}
.qbar{position:relative;padding-bottom:6px}
.qtop{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  margin-bottom:8px;
}
.qnum{font-size:15px;font-weight:800;color:var(--ink)}
.qnum b{font-size:24px;color:var(--coral)}
.qnum em{font-style:normal;color:var(--ink3);font-size:14px;font-weight:700}
.qtip{font-size:13px;color:var(--ink3)}
.dots{display:flex;gap:5px}
.dots i{
  flex:1;
  height:10px;
  border-radius:6px;
  background:#EBE2C9;
  transition:background .25s,transform .25s;
}
.dots i.on{background:var(--green)}
.dots i.now{background:var(--sun);transform:scaleY(1.25)}
.scene{
  display:flex;
  gap:12px;
  align-items:flex-start;
  margin:20px 0 16px;
}
.scene-ic{
  flex:0 0 62px;
  width:62px;height:62px;
  border-radius:50%;
  border:3px solid var(--ink);
  background:var(--sun-soft);
  overflow:hidden;
  transform:rotate(-3deg);
}
.scene-ic svg{display:block;width:100%;height:100%}
.qtext{
  flex:1;
  min-width:0;
  margin:0;
  font-size:21px;
  line-height:1.55;
  font-weight:800;
  letter-spacing:-.01em;
  padding-top:2px;
}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.opt{
  display:flex;
  align-items:flex-start;
  gap:10px;
  width:100%;
  min-height:56px;
  padding:14px 14px;
  border:2px solid var(--ink);
  border-radius:16px;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.5;
  font-weight:600;
  text-align:left;
  cursor:pointer;
  box-shadow:4px 4px 0 var(--shadow);
  transition:transform .12s,box-shadow .12s,background .15s;
}
.opt:hover{background:#FFF9E4}
.opt:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.opt-key{
  flex:0 0 26px;
  width:26px;height:26px;
  border-radius:50%;
  background:var(--sun-soft);
  border:2px solid var(--ink);
  font-size:13px;
  font-weight:800;
  display:flex;align-items:center;justify-content:center;
  margin-top:1px;
  transition:background .15s;
}
.opt.is-on{background:var(--sun);box-shadow:1px 1px 0 var(--shadow);transform:translate(3px,3px)}
.opt.is-on .opt-key{background:var(--paper)}
.qfoot{margin-top:20px;display:flex;justify-content:space-between}
.lnk{
  border:0;background:none;
  padding:8px 0;
  color:var(--ink3);
  font-family:var(--sans);
  font-size:14px;
  font-weight:700;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:4px;
}
.lnk:hover{color:var(--ink)}

/* ===== 结果 ===== */
.result{padding-top:14px}
.res-card{padding:22px 18px;text-align:center;position:relative}
.res-tag{
  position:absolute;top:-14px;left:50%;
  transform:translateX(-50%) rotate(-2deg);
}
.age-circle{
  position:relative;
  width:168px;height:168px;
  margin:8px auto 0;
  border-radius:50%;
  border:3px solid var(--ink);
  background:var(--sun);
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:inset 0 -8px 0 rgba(44,64,48,.13);
}
.age-circle span{font-size:72px;font-weight:800;line-height:1;letter-spacing:-.04em}
.age-circle small{
  font-size:19px;font-weight:800;
  margin-left:4px;align-self:flex-end;
  padding-bottom:32px;
}
.age-note{font-size:13px;color:var(--ink3);margin:10px 0 0}
.res-icon{
  width:88px;height:88px;
  margin:2px auto 0;
  border-radius:50%;
  border:3px solid var(--ink);
  background:var(--paper);
  overflow:hidden;
  transform:rotate(3deg);
  box-shadow:3px 3px 0 var(--shadow);
}
.res-icon svg{display:block;width:100%;height:100%}
.type-name{
  margin:10px 0 0;
  font-size:28px;
  font-weight:800;
  line-height:1.3;
  letter-spacing:-.01em;
}
.type-line{
  margin:8px 0 0;
  font-size:16px;
  color:var(--coral);
  font-weight:700;
  line-height:1.6;
}
.datebar{
  margin-top:16px;
  padding-top:14px;
  border-top:2px dashed var(--line);
  display:flex;
  justify-content:space-between;
  font-size:12px;
  color:var(--ink3);
}

.sect{margin-top:26px}
.sect-h{
  display:flex;
  align-items:center;
  gap:10px;
  margin-bottom:12px;
}
.sect-h b{font-size:16px;font-weight:800}
.sect-h i{flex:1;height:2px;background:var(--line);border-radius:2px}
.bars{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:14px 14px 6px}
.brow{margin-bottom:12px}
.brow-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:700}
.brow-top .v{color:var(--ink3);font-weight:700}
.btrack{height:7px;border-radius:6px;background:#EEE5CC;margin-top:5px;overflow:hidden}
.bfill{display:block;height:7px;width:0;border-radius:6px;background:var(--green);transition:width .7s cubic-bezier(.22,.61,.36,1)}
.bfill.top{background:var(--coral)}
.traits{list-style:none;margin:0;padding:0}
.traits li{
  display:flex;
  gap:10px;
  padding:11px 0;
  border-bottom:1.5px dashed var(--line);
  font-size:15px;
  line-height:1.6;
}
.traits li:last-child{border-bottom:0}
.traits .n{
  flex:0 0 22px;width:22px;height:22px;
  border-radius:50%;
  background:var(--sun-soft);
  border:2px solid var(--ink);
  font-size:11px;font-weight:800;
  display:flex;align-items:center;justify-content:center;
  margin-top:2px;
}
.pair{display:flex;flex-direction:column;gap:10px}
.pair-item{
  background:var(--paper);
  border:2px solid var(--line);
  border-radius:16px;
  padding:12px 14px;
}
.pair-k{font-size:12px;font-weight:800;color:var(--ink3);letter-spacing:.04em}
.pair-v{font-size:15px;line-height:1.7;margin-top:2px}
.advice{
  background:var(--sun-soft);
  border:2px solid var(--ink);
  border-radius:18px;
  padding:14px 16px;
  box-shadow:4px 4px 0 var(--shadow);
}
.advice-k{font-size:12px;font-weight:800;color:var(--coral);letter-spacing:.06em}
.advice-v{margin:4px 0 0;font-size:17px;font-weight:700;line-height:1.65}
.cardwrap{margin-top:12px}
#shareCanvas{
  display:block;
  width:100%;max-width:330px;
  margin:0 auto;
  border:2px solid var(--line);
  border-radius:14px;
}
.hint{font-size:13px;color:var(--ink3);margin:0 0 10px}
.btn-row{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.restart{margin:26px 0 0;text-align:center}

/* ===== 页脚声明 ===== */
.legal{
  position:fixed;
  left:0;right:0;bottom:0;
  z-index:6;
  padding:8px 16px calc(8px + env(safe-area-inset-bottom));
  background:rgba(251,243,222,.95);
  border-top:2px solid var(--line);
  font-size:12px;
  line-height:1.5;
  color:var(--ink3);
  text-align:center;
}
.toast{
  position:fixed;
  left:50%;bottom:98px;
  transform:translate(-50%,10px);
  z-index:9;
  padding:9px 16px;
  border-radius:999px;
  border:2px solid var(--ink);
  background:var(--paper);
  color:var(--ink);
  font-size:14px;
  font-weight:700;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;
}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:768px){
  .wrap{max-width:640px;padding:0 30px}
  .title{font-size:48px}
  .qtext{font-size:24px}
  .age-circle{width:186px;height:186px}
  .age-circle span{font-size:80px}
  .dim-grid{grid-template-columns:repeat(4,1fr)}
  .btn-row{flex-direction:row}
  .btn-row>*{flex:1}
  #shareCanvas{max-width:380px}
}
@media (max-width:360px){
  .title{font-size:32px}
  .qtext{font-size:19px}
  .age-circle{width:150px;height:150px}
  .age-circle span{font-size:62px}
  .dim-grid{gap:8px}
  .dim-cell .ds{display:none}
}
</style>
</head>

      <p class="lede">十二个小故事，每个故事里都有只小动物要做一次选择。你替它选，它就替你把心理年龄说出来——3 岁到 99 岁，每 12 岁一档。</p>

      <div class="meta">
        <span>12 个故事</span><span>8 个年龄段</span><span>约 2 分钟</span><span>做完能存分享卡</span>
      </div>

      <div class="start-wrap">
        <button class="btn" id="startBtn">进森林看看</button>
        <p class="start-note">凭第一反应选，不用想太久</p>
      </div>

      <div class="dim-block">
        <div class="dim-head"><b>你会遇到八只小动物</b><i></i></div>
        <div class="dim-grid" id="dimGrid"></div>
      </div>
    </div>
  </section>

  <!-- ===== 视图：答题 ===== -->
  <section class="view quiz" id="viewQuiz" hidden></section>

  <!-- ===== 视图：结果 ===== -->
  <section class="view result" id="viewResult" hidden></section>

</main>

<footer class="legal">本测试基于大众心理学趣味模型改编，仅供自我觉察参考，不构成心理诊断或治疗建议</footer>

function renderQuiz() {
  var i = state.idx;
  var q = QUESTIONS[i];
  var picked = state.answers[i];
  var dots = '';
  for (var t = 0; t < QUESTIONS.length; t++) {
    dots += '<i class="' + (t < i ? 'on' : '') + (t === i ? ' now' : '') + '"></i>';
  }
  var opts = q.opts.map(function (o, j) {
    return '<button class="opt' + (picked === j ? ' is-on' : '') + '" data-i="' + j + '">'
      + '<span class="opt-key">' + 'ABCD'.charAt(j) + '</span>'

  viewQuiz.innerHTML =

    + '</div>';

function pick(j) {
  if (locked) return;
  locked = true;
  state.answers[state.idx] = j;
  var el = viewQuiz.querySelector('.opt[data-i="' + j + '"]');
  if (el) el.classList.add('is-on');
  setTimeout(function () {
    if (state.idx < QUESTIONS.length - 1) {
      state.idx++;
      renderQuiz();
      showView('quiz');
    } else {
      compute();
      renderResult();
      showView('result');
    }
    locked = false;
  }, 250);
}

/* ===== 计分：维度累计 → 落在对应年龄段 → 3—99 岁 ===== */
function compute() {
  var pts = {}, sum = 0, wsum = 0;
  DIMS.forEach(function (d) { pts[d.k] = 0; });
  state.answers.forEach(function (ai, qi) {
    var o = QUESTIONS[qi].opts[ai];
    if (o) pts[o.d] += 3;
  });
  var pct = {};
  DIMS.forEach(function (d) {
    pct[d.k] = Math.round(pts[d.k] / 18 * 100);
    var mid = (d.start + d.end) / 2;
    sum += pts[d.k];
    wsum += pts[d.k] * mid;
  });
  var raw = sum ? Math.round(wsum / sum) : 48;

  var top = DIMS[0];
  DIMS.forEach(function (d) { if (pts[d.k] > pts[top.k]) top = d; });

  // 落在主导维度对应的年龄段内，保证标签与年龄一致
  var age = Math.max(top.start, Math.min(top.end, raw));
  age = Math.max(3, Math.min(99, age));

  state.pts = pts; state.pct = pct; state.age = age; state.top = top;
  state.type = TYPES[top.k];
  state.band = top.start + '–' + top.end;
}

    + '<div class="pair-item"><div class="pair-k">盲区</div><div class="pair-v">' + type.bad + '</div></div></div></section>'

    + '<section class="sect"><div class="advice"><div class="advice-k">一句行动建议</div>'
    + '<p class="advice-v">' + type.todo + '</p></div></section>'

    + '<section class="sect"><div class="sect-h"><b>分享卡片</b><i></i></div>'
    + '<p class="hint">点按钮存成 1080×1440 的图，直接发笔记就行。</p>'
    + '<div class="cardwrap"><canvas id="shareCanvas" width="1080" height="1440"></canvas></div>'
    + '<div class="btn-row"><button class="btn" id="saveBtn">保存分享卡</button>'
    + '<button class="btn btn-2" id="copyBtn">复制结果文案</button></div></section>'

    + '<div class="restart"><button class="lnk" id="restartBtn">再进一次森林</button></div>'
    + '</div>';

  setTimeout(function () {
    var fs = viewResult.querySelectorAll('.bfill');
    for (var i = 0; i < fs.length; i++) fs[i].style.width = fs[i].getAttribute('data-w') + '%';
  }, 80);

  drawCard();
  document.getElementById('saveBtn').onclick = saveCard;
  document.getElementById('copyBtn').onclick = copyText;
  document.getElementById('restartBtn').onclick = start;
}

/* ===== 分享卡片 ===== */
function rr(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function wrapText(ctx, text, maxW) {
  var lines = [], cur = '';
  for (var i = 0; i < text.length; i++) {
    var ch = text.charAt(i);
    if (ctx.measureText(cur + ch).width > maxW && cur) { lines.push(cur); cur = ch; }
    else cur += ch;
  }
  if (cur) lines.push(cur);
  return lines;
}

function drawCard() {
  var cv = document.getElementById('shareCanvas');
  if (!cv) return;
  var c = cv.getContext('2d');
  var W = 1080, H = 1440;
  var CREAM = '#FBF3DE', PAPER = '#FFFDF4', INK = '#2C4030', INK2 = '#5E7059', INK3 = '#93A08A';
  var GREEN = '#5C8A54', SUN = '#F2BF48', CORAL = '#ED7A55', LINE = '#E6DCC2';
  var SANS = '"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif';

  c.fillStyle = CREAM;
  c.fillRect(0, 0, W, H);
  c.fillStyle = 'rgba(44,64,48,0.075)';
  for (var y = 20; y < H; y += 40) {
    for (var x = 20; x < W; x += 40) {
      c.beginPath(); c.arc(x, y, 1.6, 0, Math.PI * 2); c.fill();
    }
  }

  // 卡片 + 贴纸投影
  c.fillStyle = 'rgba(44,64,48,0.16)';
  rr(c, 60, 68, 960, 1320, 44); c.fill();
  c.fillStyle = PAPER;
  rr(c, 50, 54, 960, 1320, 44); c.fill();
  c.strokeStyle = INK; c.lineWidth = 6;
  rr(c, 50, 54, 960, 1320, 44); c.stroke();

  // 顶部标签
  c.font = '700 26px ' + SANS;
  var tagTxt = '森林心理年龄';
  var tw = c.measureText(tagTxt).width + 56;
  c.fillStyle = '#FBE3A6';
  rr(c, (W - tw) / 2, 96, tw, 52, 26); c.fill();
  c.strokeStyle = INK; c.lineWidth = 3;
  rr(c, (W - tw) / 2, 96, tw, 52, 26); c.stroke();
  c.fillStyle = INK; c.textAlign = 'center';
  c.fillText(tagTxt, W / 2, 132);

  // 年龄圆
  c.fillStyle = SUN;
  c.beginPath(); c.arc(540, 330, 132, 0, Math.PI * 2); c.fill();
  c.strokeStyle = INK; c.lineWidth = 6;
  c.beginPath(); c.arc(540, 330, 132, 0, Math.PI * 2); c.stroke();

  var numStr = String(state.age);
  c.font = '800 108px ' + SANS;
  var nw = c.measureText(numStr).width;
  c.fillStyle = INK; c.textAlign = 'left';
  c.fillText(numStr, 540 - nw / 2 - 14, 366);
  c.font = '800 40px ' + SANS;
  c.fillText('岁', 540 - nw / 2 - 14 + nw + 8, 366);

  // 类型名
  c.textAlign = 'center';
  c.fillStyle = INK;
  c.font = '800 62px ' + SANS;
  c.fillText(state.type.name, W / 2, 556);

  // 短句
  c.fillStyle = CORAL;
  c.font = '700 32px ' + SANS;
  var lineTxt = '「' + state.type.line + '」';
  c.fillText(lineTxt, W / 2, 616);

  // 虚线分隔
  c.strokeStyle = LINE; c.lineWidth = 3;
  c.setLineDash([10, 8]);
  c.beginPath(); c.moveTo(120, 668); c.lineTo(W - 120, 668); c.stroke();
  c.setLineDash([]);

  // 八条维度
  var top = 716;
  DIMS.forEach(function (d, i) {
    var yy = top + i * 49;
    c.textAlign = 'left';
    c.fillStyle = INK2;
    c.font = '700 24px ' + SANS;
    c.fillText(d.name, 120, yy + 8);
    var bx = 260, bw = 520;
    c.fillStyle = '#EEE5CC';
    rr(c, bx, yy - 2, bw, 11, 6); c.fill();
    c.fillStyle = (d.k === state.top.k) ? CORAL : GREEN;
    var wpx = Math.max(6, bw * state.pct[d.k] / 100);
    rr(c, bx, yy - 2, wpx, 11, 6); c.fill();
    c.textAlign = 'right';
    c.fillStyle = INK3;
    c.font = '700 22px ' + SANS;
    c.fillText(state.pct[d.k] + '%', W - 120, yy + 8);
  });

  // 底部刻度说明
  c.strokeStyle = LINE; c.lineWidth = 3;
  c.setLineDash([10, 8]);
  c.beginPath(); c.moveTo(120, 1128); c.lineTo(W - 120, 1128); c.stroke();
  c.setLineDash([]);

  c.textAlign = 'center';
  c.fillStyle = INK;
  c.font = '800 34px ' + SANS;
  c.fillText('3 — 99 岁，每 12 岁一档', W / 2, 1190);

  c.fillStyle = INK3;
  c.font = '400 24px ' + SANS;
  c.fillText('12 个森林小故事，八只小动物替你做选择。', W / 2, 1238);

  // 底部声明
  c.textAlign = 'center';
  c.fillStyle = INK3;
  c.font = '400 20px ' + SANS;
  var disc = wrapText(c, '本测试基于大众心理学趣味模型改编，仅供自我觉察参考，不构成心理诊断或治疗建议', 800);
  disc.forEach(function (l, i) { c.fillText(l, W / 2, 1300 + i * 28); });
}

function saveCard() {
  var cv = document.getElementById('shareCanvas');
  cv.toBlob(function (b) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(b);
    a.download = '森林心理年龄-' + state.age + '岁-' + state.type.name + '.png';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    toast('已存好，去相册或下载里看看');
  }, 'image/png');
}

function copyText() {
  var pct = state.pct;
  var txt = '森林心理年龄：' + state.age + ' 岁（' + state.band + ' 岁 · ' + state.top.name + '段）｜' + state.type.name + '\n'
    + '「' + state.type.line + '」\n'
    + DIMS.map(function (d) { return d.name + ' ' + d.start + '–' + d.end + '岁 ' + pct[d.k] + '%'; }).join(' · ') + '\n'
    + '本测试基于大众心理学趣味模型改编，仅供自我觉察参考，不构成心理诊断或治疗建议';
  var done = function () { toast('文案已复制，可以直接粘到评论区'); };
  function fb() {
    var ta = document.createElement('textarea');
    ta.value = txt;
    ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('复制失败，长按选中文字吧'); }
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(done).catch(fb);
  } else { fb(); }
}

var toastTimer = null;
function toast(msg) {
  var el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.classList.remove('show'); }, 2200);
}

/* ===== 启动 ===== */
function start() {
  state.idx = 0;
  state.answers = [];
  state.age = 0; state.pts = null; state.pct = null; state.type = null; state.top = null;
  locked = false;
  renderQuiz();
  showView('quiz');
}

document.getElementById('startBtn').onclick = start;

viewQuiz.addEventListener('click', function (e) {
  var opt = e.target.closest ? e.target.closest('.opt') : null;
  if (opt) { pick(Number(opt.getAttribute('data-i'))); return; }
  var act = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!act || locked) return;
  if (act.getAttribute('data-act') === 'back' && state.idx > 0) {
    state.idx--; renderQuiz(); showView('quiz');
  } else if (act.getAttribute('data-act') === 'restart') {
    start();
  }
});

document.addEventListener('keydown', function (e) {
  if (viewQuiz.hidden) return;
  var m = { '1': 0, '2': 1, '3': 2, '4': 3 }[e.key];
  if (m !== undefined) pick(m);
});
</script>
